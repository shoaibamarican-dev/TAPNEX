name: TAPNEX Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check project files exist
        run: |
          missing=0
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties app/google-services.json app/src/main/AndroidManifest.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing file: $f"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 and build tools
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -n 1); fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore optional fixed debug keystore
        # Optional secret. When set, the debug APK keeps one SHA-1/SHA-256 across runs,
        # so Firebase Google Sign-In keeps working. Without it, GitHub's default debug key is used.
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.TAPNEX_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.jks"
            echo "TAPNEX_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.jks" >> "$GITHUB_ENV"
            echo "Using fixed debug keystore from secret."
          else
            echo "No fixed debug keystore secret; using the default debug key."
          fi

      - name: Build debug APK
        env:
          TAPNEX_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.TAPNEX_DEBUG_KEYSTORE_PASSWORD }}
          TAPNEX_DEBUG_KEY_ALIAS: ${{ secrets.TAPNEX_DEBUG_KEY_ALIAS }}
          TAPNEX_DEBUG_KEY_PASSWORD: ${{ secrets.TAPNEX_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK exists and is not empty
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -s "$APK" ]; then
            echo "::error::Expected APK was not generated: $APK"
            exit 1
          fi
          cp "$APK" TAPNEX-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TAPNEX-debug-APK
          path: TAPNEX-debug.apk
          if-no-files-found: error
          retention-days: 14

  release-apk:
    name: Build signed release APK
    # Skips itself unless the release keystore secret exists. The secrets context
    # cannot be used in a job-level if, so each step checks the gate output instead.
    runs-on: ubuntu-latest
    steps:
      - name: Check release signing secret
        id: gate
        env:
          KEYSTORE_BASE64: ${{ secrets.TAPNEX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "No release keystore secret; skipping release build."; fi

      - name: Checkout source
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 and build tools
        if: steps.gate.outputs.ready == 'true'
        run: |
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -n 1); fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release keystore from secret
        if: steps.gate.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.TAPNEX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TAPNEX_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: steps.gate.outputs.ready == 'true'
        env:
          TAPNEX_KEYSTORE_PASSWORD: ${{ secrets.TAPNEX_KEYSTORE_PASSWORD }}
          TAPNEX_KEY_ALIAS: ${{ secrets.TAPNEX_KEY_ALIAS }}
          TAPNEX_KEY_PASSWORD: ${{ secrets.TAPNEX_KEY_PASSWORD }}
          TAPNEX_PRODUCTION_ADS: ${{ vars.TAPNEX_PRODUCTION_ADS }}
          TAPNEX_BANNER_AD_UNIT_ID: ${{ secrets.TAPNEX_BANNER_AD_UNIT_ID }}
          TAPNEX_REWARDED_AD_UNIT_ID: ${{ secrets.TAPNEX_REWARDED_AD_UNIT_ID }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Upload release APK
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TAPNEX-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  functions-build:
    name: Compile Cloud Functions (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Compile TypeScript
        working-directory: functions
        run: npm run build

      - name: Run offline tests (credit logic, SSV verification)
        working-directory: functions
        run: npm test

      - name: Verify compiled output exists
        working-directory: functions
        run: test -s lib/index.js || { echo "::error::functions/lib/index.js was not generated"; exit 1; }
